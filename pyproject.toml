[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netarchitect"
version = "1.0.0"
description = "Deterministic enterprise network planning and Cisco IOS baseline generator for CIC-307"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
authors = [{ name = "Anshbharadwaj28" }]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
netarchitect = "netarchitect.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
netarchitect = ["presets/*.json"]
