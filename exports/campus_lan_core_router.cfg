!
! NetArchitect L3 Core / Distribution Router Configuration: CIC-307 Campus LAN Architecture
! Routing Protocol: Single-Area OSPFv2 (RFC 2328)
!
hostname CORE-ROUTER-01
ip routing
spanning-tree mode rapid-pvst
!
! Class Maps for Differentiated Services (DiffServ / RFC 4594)
class-map match-any CLASS-VOICE
 match ip dscp ef
class-map match-any CLASS-VIDEO
 match ip dscp af41 af42
!
policy-map WAN-EDGE-QOS
 class CLASS-VOICE
  priority percent 30
 class CLASS-VIDEO
  bandwidth percent 25
 class class-default
  fair-queue
!
interface Vlan10
 description GATEWAY-Students_WLAN
 ip address 10.100.0.1 255.255.252.0
 no shutdown
!
interface Vlan20
 description GATEWAY-Faculty_Staff
 ip address 10.100.4.1 255.255.254.0
 no shutdown
!
interface Vlan30
 description GATEWAY-Smart_Classrooms_IoT
 ip address 10.100.6.1 255.255.255.0
 no shutdown
!
interface Vlan40
 description GATEWAY-VoIP_Telephony
 ip address 10.100.7.1 255.255.255.128
 no shutdown
!
interface Vlan50
 description GATEWAY-Security_CCTV
 ip address 10.100.7.129 255.255.255.224
 no shutdown
!
ip access-list extended ACL-ISOLATE-MGMT
 permit udp any any eq bootps
 permit udp any any eq domain
 permit icmp any any
 deny ip 10.0.0.0 0.255.255.255 192.168.0.0 0.0.255.255
 permit ip any any
!
router ospf 1
 router-id 1.1.1.1
 passive-interface default
 no passive-interface Vlan10
 network 10.100.0.0 0.0.3.255 area 0
 no passive-interface Vlan20
 network 10.100.4.0 0.0.1.255 area 0
 no passive-interface Vlan30
 network 10.100.6.0 0.0.0.255 area 0
 no passive-interface Vlan40
 network 10.100.7.0 0.0.0.127 area 0
 no passive-interface Vlan50
 network 10.100.7.128 0.0.0.31 area 0
end
