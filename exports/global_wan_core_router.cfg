!
! NetArchitect L3 Core / Distribution Router Configuration: Global WAN & Multi-Cloud VPC Integration
! Routing Protocol: Hierarchical Multi-Area OSPFv2 with Border eBGP (RFC 4271)
!
hostname CORE-ROUTER-01
ip routing
spanning-tree mode rapid-pvst
!
! Class Maps for Differentiated Services (DiffServ / RFC 4594)
class-map match-any CLASS-VOICE
 match ip dscp ef
class-map match-any CLASS-VIDEO
 match ip dscp af41 af42
!
policy-map WAN-EDGE-QOS
 class CLASS-VOICE
  priority percent 30
 class CLASS-VIDEO
  bandwidth percent 25
 class class-default
  fair-queue
!
interface Vlan101
 description GATEWAY-Warehouse_Automated_IoT
 ip address 10.0.0.1 255.255.248.0
 no shutdown
!
interface Vlan102
 description GATEWAY-Global_Edge_Scanners
 ip address 10.0.8.1 255.255.252.0
 no shutdown
!
interface Vlan201
 description GATEWAY-Chicago_Branch_Office
 ip address 10.0.12.1 255.255.254.0
 no shutdown
!
interface Vlan301
 description GATEWAY-Frankfurt_Hub_Office
 ip address 10.0.14.1 255.255.255.0
 no shutdown
!
interface Vlan401
 description GATEWAY-AWS_DirectConnect_VPC
 ip address 10.0.15.1 255.255.255.128
 no shutdown
!
interface Vlan501
 description GATEWAY-Azure_ExpressRoute_Landing
 ip address 10.0.15.129 255.255.255.192
 no shutdown
!
ip access-list extended ACL-ISOLATE-MGMT
 permit udp any any eq bootps
 permit udp any any eq domain
 permit icmp any any
 deny ip 10.0.0.0 0.255.255.255 192.168.0.0 0.0.255.255
 permit ip any any
!
router ospf 1
 router-id 1.1.1.1
 passive-interface default
 no passive-interface Vlan101
 network 10.0.0.0 0.0.7.255 area 0
 no passive-interface Vlan102
 network 10.0.8.0 0.0.3.255 area 0
 no passive-interface Vlan201
 network 10.0.12.0 0.0.1.255 area 0
 no passive-interface Vlan301
 network 10.0.14.0 0.0.0.255 area 0
 no passive-interface Vlan401
 network 10.0.15.0 0.0.0.127 area 0
 no passive-interface Vlan501
 network 10.0.15.128 0.0.0.63 area 0
!
router bgp 64512
 bgp router-id 1.1.1.1
 bgp log-neighbor-changes
 neighbor 169.254.0.1 remote-as 64512
 neighbor 169.254.0.1 description CLOUD-DIRECT-CONNECT-EDGE
 neighbor 169.254.0.1 update-source Loopback0
 !
 address-family ipv4
  network 10.0.0.0 mask 255.255.248.0
  neighbor 169.254.0.1 activate
 exit-address-family
end
