!
! NetArchitect L3 Core / Distribution Router Configuration: FinTech Metro MAN Multi-Tenant Backbone
! Routing Protocol: Hierarchical Multi-Area OSPFv2 with Border eBGP (RFC 4271)
!
hostname CORE-ROUTER-01
ip routing
spanning-tree mode rapid-pvst
!
! Class Maps for Differentiated Services (DiffServ / RFC 4594)
class-map match-any CLASS-VOICE
 match ip dscp ef
class-map match-any CLASS-VIDEO
 match ip dscp af41 af42
!
policy-map WAN-EDGE-QOS
 class CLASS-VOICE
  priority percent 30
 class CLASS-VIDEO
  bandwidth percent 25
 class class-default
  fair-queue
!
interface Vlan100
 description GATEWAY-Algorithmic_Trading_Colo
 ip address 172.16.0.1 255.255.255.0
 no shutdown
!
interface Vlan200
 description GATEWAY-HQ_Operations
 ip address 172.16.1.1 255.255.255.0
 no shutdown
!
interface Vlan300
 description GATEWAY-Disaster_Recovery_Site
 ip address 172.16.2.1 255.255.255.128
 no shutdown
!
interface Vlan999
 description GATEWAY-Out_Of_Band_Mgmt
 ip address 172.16.2.129 255.255.255.192
 no shutdown
!
ip access-list extended ACL-ISOLATE-MGMT
 permit udp any any eq bootps
 permit udp any any eq domain
 permit icmp any any
 deny ip 10.0.0.0 0.255.255.255 192.168.0.0 0.0.255.255
 permit ip any any
!
router ospf 1
 router-id 1.1.1.1
 passive-interface default
 no passive-interface Vlan100
 network 172.16.0.0 0.0.0.255 area 0
 no passive-interface Vlan200
 network 172.16.1.0 0.0.0.255 area 0
 no passive-interface Vlan300
 network 172.16.2.0 0.0.0.127 area 0
 no passive-interface Vlan999
 network 172.16.2.128 0.0.0.63 area 0
!
router bgp 65100
 bgp router-id 1.1.1.1
 bgp log-neighbor-changes
 neighbor 169.254.0.1 remote-as 64512
 neighbor 169.254.0.1 description CLOUD-DIRECT-CONNECT-EDGE
 neighbor 169.254.0.1 update-source Loopback0
 !
 address-family ipv4
  network 172.16.0.0 mask 255.255.255.0
  neighbor 169.254.0.1 activate
 exit-address-family
end
