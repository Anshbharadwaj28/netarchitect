!
! NetArchitect L3 Core / Distribution Switch Configuration: Custom Enterprise Network
! Routing Protocol: Single-Area OSPFv2 (RFC 2328)
!
hostname CORE-SW1
ip routing
spanning-tree mode rapid-pvst
!
! Class Maps for Differentiated Services (DiffServ / RFC 4594)
class-map match-any CLASS-VOICE
 match ip dscp ef
class-map match-any CLASS-VIDEO
 match ip dscp af41 af42
!
policy-map WAN-EDGE-QOS
 class CLASS-VOICE
  priority percent 30
 class CLASS-VIDEO
  bandwidth percent 25
 class class-default
  fair-queue
!
interface Vlan10
 description GATEWAY-Engineering
 ip address 192.168.0.1 255.255.254.0
 no shutdown
!
interface Vlan20
 description GATEWAY-HR
 ip address 192.168.2.1 255.255.255.128
 no shutdown
!
interface Vlan30
 description GATEWAY-IoT
 ip address 192.168.2.129 255.255.255.192
 no shutdown
!
interface Vlan40
 description GATEWAY-Voice
 ip address 192.168.2.193 255.255.255.224
 no shutdown
!
router ospf 1
 router-id 1.1.1.1
 passive-interface default
 network 192.168.0.0 0.0.1.255 area 0
 network 192.168.2.0 0.0.0.127 area 0
 network 192.168.2.128 0.0.0.63 area 0
 network 192.168.2.192 0.0.0.31 area 0
end
